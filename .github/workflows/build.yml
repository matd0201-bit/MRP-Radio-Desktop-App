name: Build MISHAP RP RADIO Portable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-portable:
    name: Windows x64 · EXE portable
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Compiler le EXE portable
        run: npm run dist:win

      - name: Publier le fichier EXE comme artefact GitHub
        uses: actions/upload-artifact@v6
        with:
          name: MISHAP-RP-RADIO-Windows-Portable
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Ajouter le EXE à une GitHub Release (uniquement sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
